  <line x1="42" y1="20" x2="42" y2="205" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="42" y1="205" x2="466" y2="205" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M48,232 C78,150 96,72 118,62 C138,80 146,104 160,110 C172,98 186,96 196,112 C212,146 224,172 240,178 C276,182 306,130 336,112 C368,132 406,170 434,180 L470,206" fill="none" stroke="#1e3a8a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#b91c1c" stroke="#ffffff" stroke-width="1">
    <circle cx="118" cy="62" r="4.5"/>
    <circle cx="190" cy="99" r="4.5"/>
    <circle cx="240" cy="178" r="4.5"/>
    <circle cx="336" cy="112" r="4.5"/>
    <circle cx="418" cy="171" r="4.5"/>
  </g>
  <g fill="#334155" font-size="15" font-weight="700" text-anchor="middle">
    <text x="118" y="46">&#9314;</text>
    <text x="196" y="86">&#9312;</text>
    <text x="236" y="198">&#9316;</text>
    <text x="336" y="96">&#9313;</text>
    <text x="428" y="158">&#9315;</text>
  </g>
  <g fill="#64748b" font-size="12.5">
