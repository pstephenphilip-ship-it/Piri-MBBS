<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" font-family="system-ui,Arial,sans-serif" role="img" aria-label="A jugular venous pressure waveform with two main positive peaks and an intervening smaller notch, its five deflections each marked with a number from one to five, not in left-to-right order.">
