<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Left-ventricular coronary blood flow across one cardiac cycle: flow dips to a trough during systole and surges to a peak in early diastole, with four points numbered 1 to 4.">
  <rect width="460" height="220" fill="#ffffff"/>
  <rect x="55" y="20" width="135" height="155" fill="#f1f5f9"/>
  <line x1="55" y1="20" x2="55" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="55" y1="175" x2="435" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="190" y1="20" x2="190" y2="175" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M55,95 C90,120 105,150 120,150 C140,150 165,132 190,112 C206,96 218,50 232,46 C258,42 302,80 345,97 C382,110 408,116 425,120" fill="none" stroke="#b91c1c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#1e3a8a" stroke="#ffffff" stroke-width="1">
    <circle cx="120" cy="150" r="5"/>
    <circle cx="177" cy="120" r="5"/>
    <circle cx="232" cy="46" r="5"/>
    <circle cx="345" cy="97" r="5"/>
  </g>
  <g fill="#334155" font-size="13.5" font-weight="700" text-anchor="middle">
    <text x="120" y="168">1</text>
    <text x="165" y="112">2</text>
    <text x="232" y="36">3</text>
    <text x="357" y="90">4</text>
  </g>
  <g fill="#64748b" font-size="12.5" text-anchor="middle">
    <text x="122" y="34">systole</text>
    <text x="310" y="34">diastole</text>
    <text x="245" y="197">One cardiac cycle</text>
    <text x="16" y="98" transform="rotate(-90 16 98)">LV coronary flow</text>
  </g>
</svg>
