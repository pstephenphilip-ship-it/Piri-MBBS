<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 175" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Five action-potential tracings labelled 1 to 5">
  <rect width="500" height="175" fill="#ffffff"/>
  <line x1="10" y1="130" x2="490" y2="130" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <g fill="none" stroke="#1e3a8a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M15,130 L30,130 L33,42 L38,58 L62,60 L75,130 L90,130"/>
    <path d="M110,125 L128,102 Q138,86 146,101 L150,120 L168,100 Q178,84 186,99 L190,120"/>
    <path d="M212,130 L228,130 L231,42 L238,58 L252,80 L263,130 L276,130"/>
    <path d="M312,130 L326,130 L329,40 L334,54 L372,56 L382,130 L392,130"/>
