<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" font-family="system-ui,Arial,sans-serif" role="img" aria-label="A capillary with two opposing forces on fluid across its wall — arrow 1 points outward, arrow 2 points inward — and a lymphatic vessel draining below.">
  <rect width="440" height="240" fill="#ffffff"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#b91c1c"/></marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1e3a8a"/></marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0f766e"/></marker>
  </defs>
  <rect x="48" y="104" width="344" height="34" rx="6" fill="#fde2e4" stroke="#e11d48" stroke-width="1.6"/>
  <text x="220" y="126" text-anchor="middle" font-size="12.5" fill="#9f1239">capillary</text>
  <line x1="140" y1="104" x2="140" y2="52" stroke="#b91c1c" stroke-width="2.4" marker-end="url(#a1)"/>
  <text x="140" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">&#9312;</text>
  <text x="140" y="30" text-anchor="middle" font-size="11.5" fill="#64748b">out</text>
  <line x1="300" y1="52" x2="300" y2="102" stroke="#1e3a8a" stroke-width="2.4" marker-end="url(#a2)"/>
  <text x="300" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">&#9313;</text>
  <text x="300" y="30" text-anchor="middle" font-size="11.5" fill="#64748b">in</text>
  <line x1="200" y1="138" x2="200" y2="178" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a3)"/>
  <rect x="120" y="180" width="200" height="26" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.4"/>
  <text x="220" y="197" text-anchor="middle" font-size="12" fill="#0f766e">lymphatic drainage</text>
</svg>
