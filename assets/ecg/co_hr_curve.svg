<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Cardiac output against heart rate: a curve rising to a peak then declining, with five labelled points">
  <rect width="440" height="210" fill="#ffffff"/>
  <line x1="48" y1="20" x2="48" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="48" y1="180" x2="420" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M60,168 C120,120 190,66 240,56 C300,48 350,96 405,150" fill="none" stroke="#1e3a8a" stroke-width="2.4" stroke-linecap="round"/>
  <g fill="#b91c1c" stroke="#ffffff" stroke-width="1">
    <circle cx="95" cy="140" r="5"/>
    <circle cx="165" cy="84" r="5"/>
    <circle cx="240" cy="56" r="5"/>
    <circle cx="315" cy="80" r="5"/>
    <circle cx="385" cy="132" r="5"/>
  </g>
  <g fill="#334155" font-size="13.5" font-weight="700" text-anchor="middle">
    <text x="95" y="158">1</text>
    <text x="165" y="76">2</text>
    <text x="240" y="46">3</text>
    <text x="333" y="74">4</text>
    <text x="385" y="150">5</text>
  </g>
  <g fill="#64748b" font-size="12.5">
    <text x="234" y="202" text-anchor="middle">Heart rate</text>
    <text x="16" y="100" text-anchor="middle" transform="rotate(-90 16 100)">Cardiac output</text>
  </g>
</svg>
