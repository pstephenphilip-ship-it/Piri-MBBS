<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 230" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Mean pressure falling across the circulation from aorta to veins, with five regions numbered 1 to 5; the fall is steepest across the third region.">
  <rect width="450" height="230" fill="#ffffff"/>
  <line x1="52" y1="18" x2="52" y2="182" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="52" y1="182" x2="430" y2="182" stroke="#94a3b8" stroke-width="1.5"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="128" y1="24" x2="128" y2="182"/>
    <line x1="204" y1="24" x2="204" y2="182"/>
    <line x1="280" y1="24" x2="280" y2="182"/>
    <line x1="356" y1="24" x2="356" y2="182"/>
  </g>
  <path d="M56,52 L120,60 L200,82 C224,96 258,150 280,158 L356,166 L426,172" fill="none" stroke="#1e3a8a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#334155" font-size="14" font-weight="700" text-anchor="middle">
    <text x="90" y="200">&#9312;</text>
    <text x="166" y="200">&#9313;</text>
    <text x="242" y="200">&#9314;</text>
    <text x="318" y="200">&#9315;</text>
    <text x="393" y="200">&#9316;</text>
  </g>
  <g fill="#64748b" font-size="12.5">
    <text x="240" y="222" text-anchor="middle">Aorta &#8594; great veins</text>
    <text x="16" y="100" text-anchor="middle" transform="rotate(-90 16 100)">Mean pressure</text>
  </g>
</svg>
