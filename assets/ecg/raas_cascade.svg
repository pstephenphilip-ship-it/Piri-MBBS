<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" font-family="system-ui,Arial,sans-serif" role="img" aria-label="Renin-angiotensin-aldosterone cascade: four boxes linked by three numbered conversion arrows">
  <rect width="300" height="340" fill="#ffffff"/>
  <g font-size="13" font-weight="600" text-anchor="middle" fill="#1e293b">
    <rect x="70" y="14" width="160" height="40" rx="7" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.6"/>
    <text x="150" y="38">Angiotensinogen</text>
    <rect x="70" y="104" width="160" height="40" rx="7" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.6"/>
    <text x="150" y="128">Angiotensin I</text>
    <rect x="70" y="194" width="160" height="40" rx="7" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.6"/>
    <text x="150" y="218">Angiotensin II</text>
    <rect x="70" y="284" width="160" height="40" rx="7" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.6"/>
    <text x="150" y="308">Aldosterone</text>
  </g>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <g stroke="#334155" stroke-width="2.2" fill="none">
    <line x1="150" y1="54" x2="150" y2="100" marker-end="url(#ar)"/>
    <line x1="150" y1="144" x2="150" y2="190" marker-end="url(#ar)"/>
    <line x1="150" y1="234" x2="150" y2="280" marker-end="url(#ar)"/>
  </g>
  <g font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">
    <text x="172" y="82">&#9312;</text>
    <text x="172" y="172">&#9313;</text>
    <text x="172" y="262">&#9314;</text>
  </g>
</svg>
